<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleWave – Color Your Style</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --nav-from: #ff4567;
    --nav-to:   #ff7a45;
    --hero-from:#7c3aed;
    --hero-to:  #3b82f6;
    --foot-from:#10b981;
    --foot-to:  #0f4c75;
    --accent:   #ff4567;
    --card-bg:  #ffffff;
    --page-bg:  #f3f4f6;
    --text-dark:#1f2937;
    --text-mid: #6b7280;
    --radius:   16px;
    --shadow:   0 6px 30px rgba(0,0,0,.10);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--page-bg);
    color: var(--text-dark);
    min-height: 100vh;
  }

  /* ── NAV ── */
  nav {
    background: linear-gradient(135deg, var(--nav-from), var(--nav-to));
    padding: 0 5%;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 20px rgba(255,69,103,.35);
  }
  .brand { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: #fff; letter-spacing: 1px; }
  .nav-links { display: flex; gap: 2rem; }
  .nav-links a {
    color: rgba(255,255,255,.88); text-decoration: none;
    font-size: .9rem; font-weight: 500; transition: color .2s;
  }
  .nav-links a:hover { color: #fff; }

  /* ── HERO ── */
  .hero {
    background: linear-gradient(135deg, var(--hero-from), var(--hero-to));
    text-align: center;
    padding: 60px 5% 50px;
  }
  .hero h1 { font-family: 'Bebas Neue', sans-serif; font-size: 3.5rem; color: #fff; letter-spacing: 2px; }
  .hero p  { color: rgba(255,255,255,.8); margin-top: 8px; font-size: 1.05rem; }

  /* ── SEARCH & FILTER BAR ── */
  .controls {
    max-width: 1200px; margin: 36px auto 0; padding: 0 5%;
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
  }
  .search-wrap {
    flex: 1 1 260px; position: relative;
  }
  .search-wrap input {
    width: 100%; padding: 12px 18px 12px 44px;
    border: 2px solid #e5e7eb; border-radius: 50px;
    background: #fff; font-family: inherit; font-size: .95rem;
    transition: border-color .25s, box-shadow .25s;
    outline: none;
  }
  .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,69,103,.15); }
  .search-wrap .icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--text-mid); pointer-events: none; font-size: 1.1rem;
  }

  .filter-group { display: flex; gap: 10px; flex-wrap: wrap; }
  .filter-btn {
    padding: 10px 20px; border-radius: 50px; border: 2px solid #e5e7eb;
    background: #fff; font-family: inherit; font-size: .88rem; font-weight: 500;
    cursor: pointer; transition: all .2s; color: var(--text-dark);
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }

  .sort-select {
    padding: 10px 16px; border-radius: 50px; border: 2px solid #e5e7eb;
    font-family: inherit; font-size: .88rem; background: #fff; cursor: pointer;
    outline: none; transition: border-color .25s;
  }
  .sort-select:focus { border-color: var(--accent); }

  /* ── STATS BAR ── */
  .stats-bar {
    max-width: 1200px; margin: 20px auto 0; padding: 0 5%;
    display: flex; align-items: center; gap: 10px;
    font-size: .88rem; color: var(--text-mid);
  }
  #result-count { font-weight: 600; color: var(--text-dark); }

  /* ── CATALOG GRID ── */
  .catalog {
    max-width: 1200px; margin: 20px auto 50px; padding: 0 5%;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 26px;
  }

  /* ── PRODUCT CARD ── */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: transform .25s, box-shadow .25s;
    animation: fadeUp .4s ease both;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 14px 40px rgba(0,0,0,.14);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0);    }
  }

  .card-img {
    height: 190px;
    display: flex; align-items: center; justify-content: center;
    font-size: 3.5rem;
    position: relative;
    overflow: hidden;
  }
  .badge {
    position: absolute; top: 12px; left: 12px;
    background: var(--accent); color: #fff;
    font-size: .72rem; font-weight: 600; padding: 4px 10px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .badge-sale { background: #10b981; }
  .badge-new  { background: #3b82f6; }

  .card-body { padding: 18px 20px 20px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .card-brand { font-size: .75rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
  .card-name  { font-size: 1.05rem; font-weight: 600; color: var(--text-dark); }
  .card-desc  { font-size: .88rem; color: var(--text-mid); line-height: 1.5; flex: 1; }

  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .price { font-size: 1.15rem; font-weight: 700; color: var(--text-dark); }
  .price-old { font-size: .82rem; color: var(--text-mid); text-decoration: line-through; margin-left: 6px; }

  .btn-shop {
    padding: 9px 22px; border-radius: 50px;
    background: linear-gradient(135deg, var(--nav-from), var(--nav-to));
    color: #fff; border: none; font-family: inherit; font-size: .88rem; font-weight: 600;
    cursor: pointer; transition: opacity .2s, transform .15s;
  }
  .btn-shop:hover { opacity: .88; transform: scale(1.04); }

  /* ── EMPTY STATE ── */
  .empty {
    grid-column: 1/-1; text-align: center; padding: 60px 20px;
    color: var(--text-mid);
  }
  .empty .emoji { font-size: 3.5rem; display: block; margin-bottom: 12px; }
  .empty h3 { font-size: 1.2rem; color: var(--text-dark); margin-bottom: 6px; }

  /* ── FOOTER ── */
  footer {
    background: linear-gradient(135deg, var(--foot-from), var(--foot-to));
    text-align: center; padding: 22px;
    color: rgba(255,255,255,.75); font-size: .88rem;
  }

  @media (max-width: 600px) {
    .nav-links { display: none; }
    .hero h1  { font-size: 2.4rem; }
    .controls { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <span class="brand">StyleWave</span>
  <div class="nav-links">
    <a href="#">Home</a>
    <a href="#">Brands</a>
    <a href="#">Men</a>
    <a href="#">Women</a>
    <a href="#">Contact</a>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <h1>Color Your Style</h1>
  <p>Explore vibrant fashion from top clothing brands</p>
</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="search-wrap">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search products, brands…" />
  </div>

  <div class="filter-group" id="categoryFilters">
    <button class="filter-btn active" data-cat="all">All</button>
    <button class="filter-btn" data-cat="men">Men</button>
    <button class="filter-btn" data-cat="women">Women</button>
    <button class="filter-btn" data-cat="sport">Sport</button>
    <button class="filter-btn" data-cat="casual">Casual</button>
  </div>

  <select class="sort-select" id="sortSelect">
    <option value="default">Sort: Default</option>
    <option value="price-asc">Price: Low → High</option>
    <option value="price-desc">Price: High → Low</option>
    <option value="name-asc">Name: A → Z</option>
  </select>
</div>

<!-- STATS -->
<div class="stats-bar">
  Showing <span id="result-count">0</span>&nbsp;products
</div>

<!-- CATALOG -->
<div class="catalog" id="catalog"></div>

<!-- FOOTER -->
<footer>© 2026 StyleWave | Fashion that Speaks Color</footer>

<script>
/* ─────────────────────────────────────────────
   PRODUCT DATABASE  (simulates a MySQL result)
───────────────────────────────────────────── */
const products = [
  // ADIDAS
  { id:1,  brand:"Adidas", name:"Ultraboost 24",       desc:"Responsive cushioning for every run.",          price:180, oldPrice:220, cat:"sport",  emoji:"👟", badge:"sale"  },
  { id:2,  brand:"Adidas", name:"Classic Trefoil Tee", desc:"Iconic streetwear in soft cotton blend.",       price:45,  oldPrice:null,cat:"casual", emoji:"👕", badge:"new"   },
  { id:3,  brand:"Adidas", name:"Tiro Track Pants",    desc:"Slim-fit training pants with 3-stripe detail.",price:65,  oldPrice:80,  cat:"men",    emoji:"👖", badge:"sale"  },
  // ZARA
  { id:4,  brand:"Zara",   name:"Oversized Linen Blazer",desc:"Global-inspired structured silhouette.",     price:110, oldPrice:null,cat:"women",  emoji:"🧥", badge:"new"   },
  { id:5,  brand:"Zara",   name:"Floral Midi Dress",   desc:"Vibrant print for spring/summer occasions.",   price:79,  oldPrice:99,  cat:"women",  emoji:"👗", badge:"sale"  },
  { id:6,  brand:"Zara",   name:"Slim Chino",          desc:"Modern cut with stretch comfort fabric.",      price:58,  oldPrice:null,cat:"men",    emoji:"👖", badge:null    },
  // H&M
  { id:7,  brand:"H&M",    name:"Basic Crew Neck",     desc:"Everyday essential in organic cotton.",        price:18,  oldPrice:null,cat:"casual", emoji:"👕", badge:null    },
  { id:8,  brand:"H&M",    name:"High Waist Leggings", desc:"Sculpting fit for workouts and beyond.",       price:25,  oldPrice:35,  cat:"sport",  emoji:"🩱", badge:"sale"  },
  { id:9,  brand:"H&M",    name:"Utility Jacket",      desc:"Cargo-style jacket for all-season wear.",      price:55,  oldPrice:null,cat:"men",    emoji:"🧥", badge:"new"   },
  // PUMA
  { id:10, brand:"Puma",   name:"Suede Classic XXI",   desc:"Timeless silhouette with suede upper.",        price:90,  oldPrice:110, cat:"casual", emoji:"👟", badge:"sale"  },
  { id:11, brand:"Puma",   name:"RunFit Tank",         desc:"Breathable mesh for peak athletic performance.",price:35, oldPrice:null,cat:"sport",  emoji:"🎽", badge:null    },
  { id:12, brand:"Puma",   name:"Essentials Logo Hoodie",desc:"Cosy pullover with embroidered logo.",       price:60,  oldPrice:null,cat:"men",    emoji:"🧣", badge:"new"   },
];

/* ─────────────────────────────────────────────
   STATE
───────────────────────────────────────────── */
let activeCategory = "all";
let searchQuery    = "";
let sortOrder      = "default";

/* ─────────────────────────────────────────────
   FILTER + SORT ENGINE
───────────────────────────────────────────── */
function getFiltered() {
  let list = [...products];

  // category filter
  if (activeCategory !== "all") {
    list = list.filter(p => p.cat === activeCategory);
  }

  // search filter
  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase();
    list = list.filter(p =>
      p.name.toLowerCase().includes(q)  ||
      p.brand.toLowerCase().includes(q) ||
      p.desc.toLowerCase().includes(q)
    );
  }

  // sort
  if (sortOrder === "price-asc")  list.sort((a,b) => a.price - b.price);
  if (sortOrder === "price-desc") list.sort((a,b) => b.price - a.price);
  if (sortOrder === "name-asc")   list.sort((a,b) => a.name.localeCompare(b.name));

  return list;
}

/* ─────────────────────────────────────────────
   RENDER
───────────────────────────────────────────── */
function render() {
  const filtered = getFiltered();
  const catalog  = document.getElementById("catalog");
  document.getElementById("result-count").textContent = filtered.length;

  if (!filtered.length) {
    catalog.innerHTML = `
      <div class="empty">
        <span class="emoji">🔦</span>
        <h3>No products found</h3>
        <p>Try a different search term or category.</p>
      </div>`;
    return;
  }

  catalog.innerHTML = filtered.map((p, i) => {
    const badgeHTML = p.badge
      ? `<span class="badge badge-${p.badge}">${p.badge}</span>`
      : "";
    const oldPriceHTML = p.oldPrice
      ? `<span class="price-old">$${p.oldPrice}</span>`
      : "";
    return `
      <div class="card" style="animation-delay:${i * 0.05}s">
        <div class="card-img" style="background:${cardBg(p.brand)}">
          ${badgeHTML}
          ${p.emoji}
        </div>
        <div class="card-body">
          <span class="card-brand">${p.brand}</span>
          <h3 class="card-name">${p.name}</h3>
          <p class="card-desc">${p.desc}</p>
          <div class="card-footer">
            <div>
              <span class="price">$${p.price}</span>
              ${oldPriceHTML}
            </div>
            <button class="btn-shop" onclick="addToCart('${p.name}')">Shop Now</button>
          </div>
        </div>
      </div>`;
  }).join("");
}

function cardBg(brand) {
  const map = {
    Adidas: "linear-gradient(135deg,#f0fdf4,#dcfce7)",
    Zara:   "linear-gradient(135deg,#fdf4ff,#f3e8ff)",
    "H&M":  "linear-gradient(135deg,#fff7ed,#ffedd5)",
    Puma:   "linear-gradient(135deg,#eff6ff,#dbeafe)",
  };
  return map[brand] || "#f9fafb";
}

function addToCart(name) {
  const btn = event.currentTarget;
  btn.textContent = "✓ Added!";
  btn.style.background = "linear-gradient(135deg,#10b981,#059669)";
  setTimeout(() => {
    btn.textContent = "Shop Now";
    btn.style.background = "";
  }, 1400);
}

/* ─────────────────────────────────────────────
   EVENT LISTENERS
───────────────────────────────────────────── */
document.getElementById("searchInput").addEventListener("input", e => {
  searchQuery = e.target.value;
  render();
});

document.getElementById("categoryFilters").addEventListener("click", e => {
  if (!e.target.matches(".filter-btn")) return;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  activeCategory = e.target.dataset.cat;
  render();
});

document.getElementById("sortSelect").addEventListener("change", e => {
  sortOrder = e.target.value;
  render();
});

/* ─────────────────────────────────────────────
   INIT
───────────────────────────────────────────── */
render();
</script>
</body>
</html>
